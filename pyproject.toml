[project]
name = "python-social-auth-meta"
requires-python = ">=3.11"
version = "2025.0"

[tool.ruff.lint]
ignore = [
  "COM",  # CONFIG: No trailing commas
  "D203",  # CONFIG: incompatible with D211
  "D212",  # CONFIG: incompatible with D213
  "E501",  # WONTFIX: we accept long strings (rest is formatted by ruff)
  "S603",  # CONFIG: subprocess is being used
  "S607",  # CONFIG: subprocess executes system tools
  "T201",  # CONFIG: print is used
  'ISC001'  # CONFIG: formatter
]
select = ["ALL"]

[tool.ruff.lint.flake8-copyright]
min-file-size = 2
notice-rgx = "(?i)Copyright\\s+©\\s+"

[tool.rumdl]
disable = [
  # We do not enforce heading
  "first-line-heading",
  # Avoid length limit checks
  "line-length"
]

[tool.tomlsort]
ignore_case = true
sort_inline_arrays = true
sort_inline_tables = true
sort_table_keys = true
spaces_before_inline_comment = 2
